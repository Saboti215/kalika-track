<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>kalika-track</title>
  <link rel="icon" href="./app/icons/icon-192.png" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f4;
      color: #12201a;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background: #0f1c14;
        color: #eef4ef;
      }
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .card {
      width: min(92vw, 26rem);
      text-align: center;
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      background: linear-gradient(180deg, #1b4332, #2d6a4f);
      color: #f4f6f4;
      box-shadow: 0 20px 50px rgba(20, 40, 30, 0.25);
    }

    .icon {
      width: 4rem;
      height: 4rem;
      margin-bottom: 1rem;
      border-radius: 1rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 1.75rem;
      font-size: 0.95rem;
      opacity: 0.85;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 0.9rem;
      background: #f4f6f4;
      color: #1b4332;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .hint {
      margin: 1.5rem 0 0;
      font-size: 0.8rem;
      opacity: 0.75;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="./app/icons/icon-192.png" alt="" />
    <h1>kalika-track</h1>
    <p>Zeiterfassung mit Überstundenkonto — läuft vollständig auf deinem Gerät.</p>
    <a class="btn" href="./app/">App öffnen</a>
    <p class="hint">Tipp: Öffne die App in Safari und füge sie über "Teilen" → "Zum Home-Bildschirm" hinzu, um sie wie eine eigene App zu nutzen.</p>
  </div>
</body>
</html>
